<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Burbujas</title>
  <meta name="theme-color" content="#1D3B4F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/kids.css">
  <script src="../js/common.js"></script>
  <script src="../js/fx.js"></script>
  <script src="../js/sprites.js"></script>
  <script src="../js/kids.js"></script>
  <style>
    body.kids { background-color: #DDF3E4; }
    .pond { position: relative; flex: 1; overflow: hidden; touch-action: none; }
    .pond::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--blue); border-top: 2px solid var(--line); }
    .kb { position: absolute; left: 0; top: 0; width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--line); background: #BFE0FF; z-index: 2; cursor: pointer; }
    .kb::before { content: ""; position: absolute; left: 18%; top: 14%; width: 26%; height: 14%; border-radius: 50%; background: #fff; transform: rotate(-30deg); }
    .kb .who { position: absolute; inset: 20%; opacity: .35; }
    .animal { position: absolute; width: 150px; height: 150px; z-index: 3; pointer-events: none; animation: pop-out 1.8s ease-out forwards; }
    @keyframes pop-out {
      0% { transform: scale(.3); } 20% { transform: scale(1.15); } 35% { transform: scale(1); }
      100% { transform: translateY(-140px) scale(.9); opacity: 0; }
    }
    .name { position: absolute; z-index: 4; transform: translate(-50%, 0); pointer-events: none;
      background: var(--black); color: var(--yellow); border-radius: 10px; padding: 4px 12px; font-weight: 800; font-size: 1.8rem; white-space: nowrap;
      animation: pop-out 1.8s ease-out forwards; }
  </style>
</head>
<body class="kids">
<div class="page game-page">
  <header class="kbar">
    <a class="khome" href="index.html" aria-label="Volver a la Zona Peques"><i data-sprite="home"></i></a>
    <div class="ktitle"><small>Toca y descubre</small>Burbujas</div>
    <button class="icon-btn" id="mute"></button>
  </header>
  <div class="pond" id="pond"></div>
</div>
<script>
(function () {
  const B = Bano, K = Kids, FX = Bano.fx;
  const $ = (id) => document.getElementById(id);

  const pond = $("pond");
  const animals = [
    ["duck", "¡Un patito!", "Patito"], ["frog", "¡Una rana!", "Rana"], ["fish", "¡Un pez!", "Pez"],
    ["cat", "¡Un gato!", "Gato"], ["dog", "¡Un perrito!", "Perrito"], ["chick", "¡Un pollito!", "Pollito"],
  ];
  let bubbles = [], last = performance.now(), spawnT = 0;
  function spawn() {
    const W = pond.clientWidth, H = pond.clientHeight;
    const size = Math.min(150, Math.max(110, W * 0.32));
    const a = B.pick(animals);
    const el = document.createElement("div");
    el.className = "kb";
    el.style.width = el.style.height = size + "px";
    el.innerHTML = '<span class="who">' + Sprites.svg(a[0]) + "</span>";
    const b = { el, a, size, x: B.rand(0, Math.max(1, W - size)), y: H, vy: B.rand(38, 60), ph: B.rand(0, 6) };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); pop(b); });
    pond.appendChild(el);
    bubbles.push(b);
  }
  function pop(b) {
    if (b.gone) return;
    b.gone = true; b.el.remove();
    bubbles = bubbles.filter((x) => x !== b);
    const cx = b.x + b.size / 2, cy = b.y + b.size / 2;
    const an = document.createElement("div");
    an.className = "animal"; an.innerHTML = Sprites.svg(b.a[0]);
    an.style.left = cx - 75 + "px"; an.style.top = cy - 75 + "px";
    const nm = document.createElement("div");
    nm.className = "name"; nm.textContent = b.a[2];
    nm.style.left = cx + "px"; nm.style.top = cy + 70 + "px";
    pond.append(an, nm);
    setTimeout(() => { an.remove(); nm.remove(); }, 1850);
    const r = pond.getBoundingClientRect();
    FX.bubbles(r.left + cx, r.top + cy, 10);
    B.sfx.bubble(); B.vibrate(15);
    setTimeout(() => K.animalSounds[b.a[0]](), 120);
    setTimeout(() => K.say(b.a[1]), 500);
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    spawnT -= dt;
    if (spawnT <= 0 && bubbles.length < 5) { spawn(); spawnT = B.rand(1.2, 2.2); }
    for (const b of bubbles.slice()) {
      b.y -= b.vy * dt; b.ph += dt * 1.5;
      b.el.style.transform = `translate(${b.x + Math.sin(b.ph) * 14}px, ${b.y}px)`;
      if (b.y < -b.size) { b.el.remove(); bubbles = bubbles.filter((x) => x !== b); }
    }
    requestAnimationFrame(loop);
  }
  spawn(); requestAnimationFrame(loop);
  Sprites.favicon("frog");
})();
</script>
</body>
</html>
