<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Perfil</title>
  <meta name="theme-color" content="#f3fbf9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/perfil.js"></script>
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 40px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top h1 { flex: 1; margin: 0; font-size: 1.6rem; }
    .box { background: var(--card); border: 2px solid var(--card-edge); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
    .box h2 { margin: 0 0 10px; font-size: 1.25rem; }
    .muted { color: var(--ink-soft); font-size: .92rem; line-height: 1.4; }
    label.f { display: block; font-weight: 800; margin: 14px 0 6px; }
    input[type=text], input[type=email], input[type=password], select {
      width: 100%; min-height: 50px; border-radius: 14px; border: 2px solid rgba(35,54,74,.15);
      padding: 0 14px; font: inherit; font-size: 1.05rem; background: #fff; color: #23364a;
    }
    input:focus, select:focus { outline: 3px solid color-mix(in srgb, var(--mint) 60%, transparent); border-color: var(--mint); }
    .preview { display: flex; justify-content: center; padding: 10px 0 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { appearance: none; border: 2px solid transparent; background: #fff; border-radius: 14px; min-width: 48px; height: 48px; font-size: 1.6rem; cursor: pointer; box-shadow: 0 2px 0 rgba(35,54,74,.1); }
    .chip.on { border-color: var(--mint-deep); transform: scale(1.08); }
    .chip.color { border-radius: 50%; width: 44px; min-width: 44px; height: 44px; }
    .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-weight: 700; font-size: .92rem; }
    .check input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
    .err { color: var(--danger); font-weight: 800; min-height: 1.3em; margin-top: 10px; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .me { display: flex; align-items: center; gap: 16px; }
    .me b { font-family: var(--font-title); font-size: 1.6rem; display: block; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .stats span { background: color-mix(in srgb, var(--mint) 18%, #fff); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .85rem; }
    .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .medal { text-align: center; padding: 10px 6px; border-radius: 16px; background: #fff; box-shadow: 0 2px 0 rgba(35,54,74,.08); }
    .medal .e { font-size: 2.2rem; line-height: 1.2; }
    .medal b { display: block; font-size: .8rem; line-height: 1.2; margin-top: 4px; }
    .medal small { display: block; font-size: .68rem; color: var(--ink-soft); line-height: 1.25; margin-top: 3px; }
    .medal.off { opacity: .45; filter: grayscale(1); }
    .tabs { display: flex; gap: 8px; margin-bottom: 6px; }
    .tabs button { flex: 1; min-height: 44px; border-radius: 999px; border: 0; font-weight: 800; background: rgba(255,255,255,.6); cursor: pointer; }
    .tabs button.on { background: var(--mint); color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="icon-btn" href="index.html" aria-label="Volver al menú">🚪</a>
      <h1>Mi perfil</h1>
      <button class="icon-btn" id="mute"></button>
    </div>

    <!-- Sin perfil -->
    <section id="noProfile" hidden>
      <div class="tabs" id="tabs" hidden><button class="on" data-t="reg">Crear cuenta</button><button data-t="login">Entrar</button></div>

      <form class="box" id="regForm" autocomplete="on">
        <h2>¡Regístrate!</h2>
        <p class="muted" id="regIntro"></p>
        <label class="f" for="apodo">Apodo</label>
        <input type="text" id="apodo" maxlength="16" placeholder="Ej. CapitánRollo" required>
        <label class="f" for="edad">Edad</label>
        <select id="edad" required></select>
        <label class="f">Tu avatar</label>
        <div class="preview" id="preview"></div>
        <p class="muted" style="margin:8px 0 6px">Personaje</p><div class="chips" id="bases"></div>
        <p class="muted" style="margin:12px 0 6px">Color</p><div class="chips" id="colors"></div>
        <p class="muted" style="margin:12px 0 6px">Accesorio</p><div class="chips" id="extras"></div>
        <div id="onlineFields" hidden>
          <label class="f" for="email" id="emailLabel">Correo</label>
          <input type="email" id="email" autocomplete="email">
          <label class="f" for="pass">Contraseña (mínimo 6)</label>
          <input type="password" id="pass" autocomplete="new-password" minlength="6">
          <label class="check" id="permisoRow" hidden><input type="checkbox" id="permiso"><span>Soy mamá, papá o tutor de este niño o niña y doy permiso para crear su cuenta.</span></label>
        </div>
        <div class="err" id="regErr"></div>
        <div class="actions"><button class="btn" type="submit" id="regBtn">Crear mi perfil</button></div>
        <p class="muted" style="margin-top:14px">Solo guardamos tu apodo, tu edad, tu avatar y tu progreso. Usa un apodo, no tu nombre real.</p>
      </form>

      <form class="box" id="loginForm" hidden>
        <h2>Entrar</h2>
        <label class="f" for="lEmail">Correo</label>
        <input type="email" id="lEmail" autocomplete="email" required>
        <label class="f" for="lPass">Contraseña</label>
        <input type="password" id="lPass" autocomplete="current-password" required>
        <div class="err" id="loginErr"></div>
        <div class="actions"><button class="btn blue" type="submit">Entrar</button></div>
      </form>
    </section>

    <!-- Con perfil -->
    <section id="hasProfile" hidden>
      <div class="box">
        <div class="me" id="me"></div>
        <div class="stats" id="stats"></div>
        <div class="actions">
          <a class="btn" id="zoneBtn" href="index.html" style="text-decoration:none"></a>
          <button class="btn ghost" id="editBtn">✏️ Cambiar avatar</button>
          <button class="btn ghost" id="outBtn"></button>
        </div>
      </div>
      <div class="box" id="retoBox"></div>
      <div class="box">
        <h2>🏅 Mis medallas <span class="muted" id="medCount"></span></h2>
        <div class="medals" id="medals"></div>
      </div>
    </section>
  </div>

  <script>
  (function () {
    const B = Bano, A = Account, $ = (id) => document.getElementById(id);
    let av = { base: "🧻", color: "#ffd45e", extra: "" }, editing = false;

    // Edad
    $("edad").innerHTML = '<option value="">Elige…</option>' + Array.from({ length: 97 }, (_, i) => i + 3).map((n) => `<option value="${n}">${n} años</option>`).join("");

    function chips(el, list, key, isColor) {
      el.innerHTML = list.map((v) => `<button type="button" class="chip${isColor ? " color" : ""}${av[key] === v ? " on" : ""}" data-v="${v}" ${isColor ? `style="background:${v}"` : ""} aria-label="${v || "Sin accesorio"}">${isColor ? "" : (v || "🚫")}</button>`).join("");
      el.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { av[key] = c.dataset.v; B.sfx.click(); paintBuilder(); }));
    }
    function paintBuilder() {
      $("preview").innerHTML = A.avatarHTML(av, 96);
      chips($("bases"), A.AVATAR.bases, "base");
      chips($("colors"), A.AVATAR.colors, "color", true);
      chips($("extras"), A.AVATAR.extras, "extra");
    }
    function paintAgeRules() {
      const edad = +$("edad").value;
      const kid = edad && edad < 13;
      $("permisoRow").hidden = !(A.online && kid);
      $("emailLabel").textContent = kid ? "Correo de un adulto" : "Correo";
    }
    $("edad").addEventListener("change", paintAgeRules);

    function zoneInfo(edad) {
      const z = A.zoneFor(edad);
      return z === "peques" ? ["🐤 Ir a la Zona Peques", "ninos/index.html"] : z === "grandes" ? ["🚀 Ir a la Zona Grandes", "grandes/index.html"] : ["🚽 Ir a los juegos", "index.html"];
    }

    function render() {
      const p = A.profile();
      const showForm = !p || editing;
      $("noProfile").hidden = !showForm; $("hasProfile").hidden = showForm;
      if (showForm) {
        if (p) { av = Object.assign({}, p.avatar); $("apodo").value = p.apodo; $("edad").value = p.edad; }
        $("tabs").hidden = !A.online || editing;
        $("onlineFields").hidden = !A.online || editing;
        $("regBtn").textContent = editing ? "Guardar cambios" : A.online ? "Crear mi cuenta" : "Crear mi perfil";
        $("regIntro").textContent = editing ? "Cambia lo que quieras." :
          A.online ? "Crea tu cuenta para guardar tus récords y medallas en cualquier celular." :
          "Tu perfil se guarda en este celular para que tus récords y medallas lleven tu nombre.";
        paintBuilder(); paintAgeRules();
        return;
      }
      $("me").innerHTML = A.avatarHTML(p.avatar, 84) + `<div><b></b><span class="muted">${p.edad} años${A.online && A.user() ? " · cuenta en línea ☁️" : " · guardado en este celular"}</span></div>`;
      $("me").querySelector("b").textContent = p.apodo;
      const [zt, zh] = zoneInfo(p.edad);
      $("zoneBtn").textContent = zt; $("zoneBtn").href = zh;
      $("outBtn").textContent = A.online && A.user() ? "🚪 Cerrar sesión" : "🗑️ Borrar mi perfil";
      // estadísticas
      const ids = ["lluvia", "cadena", "burbujas", "memorama", "tuberia", "trivia", "aterriza", "mate", "verdad", "tiro", "grifos", "laberinto", "reflejos", "ahorcado"];
      const total = ids.reduce((s, id) => s + B.plays(id), 0), tried = ids.filter((id) => B.plays(id)).length;
      $("stats").innerHTML = `<span>🎮 ${total} partidas</span><span>🧭 ${tried} juegos probados</span><span>📅 ${B.store.get("retos:count", 0)} retos</span>`;
      // reto
      const r = Retos.today();
      $("retoBox").innerHTML = `<h2>📅 Reto del día</h2><p style="margin:0 0 12px;font-weight:800">${r.txt}</p>` +
        (r.done ? '<p class="muted">✅ ¡Completado! Vuelve mañana por otro.</p>' : `<a class="btn blue" style="text-decoration:none" href="${r.href}">¡Aceptar reto!</a>`);
      // medallas
      Logros.check(true);
      const have = new Set(Logros.have());
      $("medCount").textContent = `(${Logros.list.filter((m) => have.has(m.id)).length}/${Logros.list.length})`;
      $("medals").innerHTML = Logros.list.map((m) => `<div class="medal${have.has(m.id) ? "" : " off"}"><div class="e">${m.e}</div><b>${m.t}</b><small>${m.d}</small></div>`).join("");
    }

    document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
      $("regForm").hidden = b.dataset.t !== "reg"; $("loginForm").hidden = b.dataset.t !== "login";
    }));

    $("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const apodo = $("apodo").value.trim(), edad = +$("edad").value;
      const err = (m) => { $("regErr").textContent = m; B.sfx.bad(); };
      if (apodo.length < 2) return err("Escribe un apodo de al menos 2 letras.");
      if (!edad) return err("Elige tu edad.");
      if (editing) { await A.saveProfile({ apodo, edad, avatar: Object.assign({}, av) }); editing = false; B.sfx.good(); render(); return; }
      let res;
      if (A.online) {
        if (edad < 13 && !$("permiso").checked) return err("Un adulto tiene que dar permiso para crear la cuenta.");
        $("regBtn").disabled = true;
        res = await A.register({ email: $("email").value.trim(), password: $("pass").value, apodo, edad, avatar: Object.assign({}, av) });
        $("regBtn").disabled = false;
      } else {
        res = await A.register({ apodo, edad, avatar: Object.assign({}, av) });
      }
      if (!res.ok) return err(res.msg);
      B.sfx.win(); B.fx.confetti();
      render();
    });
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await A.login($("lEmail").value.trim(), $("lPass").value);
      if (!res.ok) { $("loginErr").textContent = res.msg; B.sfx.bad(); return; }
      B.sfx.good();
    });
    $("editBtn").addEventListener("click", () => { editing = true; render(); });
    $("outBtn").addEventListener("click", async () => {
      if (!(A.online && A.user()) && !confirm("¿Borrar tu perfil de este celular? Tus récords se quedan.")) return;
      await A.logout(); render();
    });
    A.onChange(render);
    A.ready.then(render);
    render();
  })();
  </script>
</body>
</html>
