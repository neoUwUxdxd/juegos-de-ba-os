<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Trivia del Trono</title>
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js"></script>
  <script src="../js/fx.js"></script>
  <script src="../js/sprites.js"></script>
  <style>
    .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px 24px; touch-action: pan-y; }
    .inner { max-width: 480px; margin: 0 auto; }
    .dots { display: flex; gap: 4px; justify-content: center; margin: 4px 0 14px; }
    .dots i { flex: 1; max-width: 34px; height: 12px; border: 2px solid var(--line); background: var(--paper); border-radius: 2px; }
    .dots i.cur { background: var(--yellow); }
    .dots i.ok { background: var(--green); }
    .dots i.ko { background: var(--red); }
    .qcard {
      position: relative;
      background: var(--paper);
      border: 3px solid var(--line); border-radius: 4px;
      box-shadow: var(--shadow);
      min-height: 140px;
      animation: q-in .22s ease-out both;
    }
    @keyframes q-in { from { transform: translateX(24px); opacity: 0; } }
    .qcard .kind {
      display: flex; justify-content: space-between;
      background: var(--black); color: var(--yellow);
      padding: 6px 12px;
      font-family: var(--font-mono); font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    }
    .qcard .kind.word { background: var(--blue); color: #fff; }
    .qcard .q-body { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 18px; }
    .qcard h2 { font-size: 1.55rem; line-height: 1.05; margin: 0; flex: 1; font-stretch: 78%; }
    .qcard .qpic { width: 64px; height: 64px; flex: none; }
    .opts { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .opt {
      appearance: none; cursor: pointer;
      min-height: 56px; padding: 8px 12px; border-radius: 4px; text-align: left;
      background: var(--paper); color: var(--ink);
      border: 3px solid var(--line);
      box-shadow: var(--shadow);
      font-weight: 700; font-size: 1.05rem;
      display: flex; gap: 12px; align-items: center;
      transition: transform .06s linear, box-shadow .06s linear;
    }
    .opt b {
      flex: none; width: 32px; height: 32px; display: grid; place-items: center;
      background: var(--yellow); color: #111; border: 2px solid #111; border-radius: 3px;
      font-family: var(--font-mono);
    }
    .opt:active { transform: translate(4px, 4px); box-shadow: none; }
    .opt.ok { background: var(--green); color: #fff; }
    .opt.ko { background: var(--red); color: #fff; animation: nope .3s steps(4); }
    @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* Palabra revuelta */
    .slots, .letters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .slot, .letter {
      width: clamp(28px, calc((min(100vw, 480px) - 32px - 8 * 6px) / 9), 44px);
      aspect-ratio: 0.84; border-radius: 3px; display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 700; font-size: clamp(1.05rem, 5vw, 1.4rem);
    }
    .slot { background: var(--paper); border: 3px dashed var(--line); cursor: pointer; }
    .slot.filled { border-style: solid; }
    .letter {
      appearance: none; cursor: pointer;
      background: var(--yellow); color: #111;
      border: 3px solid var(--line);
      box-shadow: 3px 3px 0 var(--line);
    }
    .letter:active { transform: translate(3px, 3px); box-shadow: none; }
    .letter.used { opacity: .15; pointer-events: none; }
    .slots.ok .slot { background: var(--green); color: #fff; }
    .slots.ko { animation: nope .3s steps(4); }
    .word-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
    .word-actions .btn { min-height: 46px; font-size: 1rem; padding: 0 14px; }
    .reveal { text-align: center; margin-top: 12px; font-family: var(--font-mono); font-weight: 700; color: var(--ink); min-height: 1.4em; }
  </style>
</head>
<body class="game-page">
  <header class="hud">
    <a class="icon-btn" href="../index.html" aria-label="Volver al menú"><i data-sprite="door"></i></a>
    <div class="hud-title"><span class="hud-num">06</span>Trivia</div>
    <div class="pill" id="score">0</div>
    <button class="icon-btn" id="mute"></button>
  </header>
  <div class="paper-bar"><i id="barFill"></i><b id="barTxt"></b></div>
  <div class="stage">
    <div class="scroll"><div class="inner">
      <div class="dots" id="dots"></div>
      <div id="round"></div>
    </div></div>
  </div>

  <div class="overlay show" id="start">
    <div class="panel">
      <div class="panel-head"><span>Instrucciones</span><span>Cubículo 06</span></div>
      <div class="panel-body">
        <div class="hero"><span class="big-pic"><i data-sprite="question"></i></span><div><h2>Trivia del trono</h2><p>Dicen que en el baño se piensa mejor. Vamos a comprobarlo.</p></div></div>
        <ol class="howto">
          <li><b>1</b><span>10 rondas: preguntas y palabras revueltas.</span></li>
          <li><b>2</b><span>El papel se acaba: responde antes de que se termine.</span></li>
          <li><b>3</b><span>100 puntos por acierto + bonus por rapidez.</span></li>
        </ol>
        <div class="actions"><button class="btn" id="go">A pensar</button></div>
      </div>
    </div>
  </div>

<script>
(function () {
  const B = Bano, FX = Bano.fx;
  const $ = (id) => document.getElementById(id);
  const roundEl = $("round"), dotsEl = $("dots"), scoreEl = $("score");
  const barFill = $("barFill"), barTxt = $("barTxt");

  // [pregunta, correcta, incorrectas]
  const BANK = [
    ["¿Cuántos huesos tiene un ser humano adulto?", "206", ["198", "212", "250"]],
    ["¿Qué planeta es conocido como «el planeta rojo»?", "Marte", ["Venus", "Júpiter", "Mercurio"]],
    ["¿Cuál es el océano más grande del mundo?", "Pacífico", ["Atlántico", "Índico", "Ártico"]],
    ["¿En qué país se inventó el papel?", "China", ["Egipto", "Grecia", "India"]],
    ["¿Cuál es el animal terrestre más rápido?", "Guepardo", ["León", "Caballo", "Antílope"]],
    ["¿Cuántos lados tiene un hexágono?", "6", ["5", "7", "8"]],
    ["¿Qué gas absorben las plantas para hacer la fotosíntesis?", "Dióxido de carbono", ["Oxígeno", "Helio", "Nitrógeno"]],
    ["¿Cuántos minutos tiene un día?", "1440", ["1240", "1600", "2400"]],
    ["¿Qué elemento químico tiene el símbolo «O»?", "Oxígeno", ["Oro", "Osmio", "Ozono"]],
    ["¿Qué metal es líquido a temperatura ambiente?", "Mercurio", ["Plomo", "Aluminio", "Estaño"]],
    ["¿Cuántas patas tiene una araña?", "8", ["6", "10", "12"]],
    ["¿Cuál es la capital de Japón?", "Tokio", ["Kioto", "Osaka", "Seúl"]],
    ["¿Cuál es el planeta más grande del sistema solar?", "Júpiter", ["Saturno", "Neptuno", "Tierra"]],
    ["¿A cuántos grados hierve el agua a nivel del mar?", "100 °C", ["90 °C", "80 °C", "120 °C"]],
    ["¿Cuál es el mamífero más grande del planeta?", "Ballena azul", ["Elefante africano", "Cachalote", "Jirafa"]],
    ["¿Qué se mide en decibelios?", "El sonido", ["La luz", "La temperatura", "El peso"]],
    ["¿Cuál es el hueso más largo del cuerpo humano?", "Fémur", ["Húmero", "Tibia", "Columna"]],
    ["¿Cuál es el país más grande del mundo?", "Rusia", ["Canadá", "China", "Brasil"]],
    ["¿Qué vitamina produce la piel al recibir sol?", "Vitamina D", ["Vitamina C", "Vitamina A", "Vitamina B12"]],
    ["¿Cuántos dientes tiene un adulto contando las muelas del juicio?", "32", ["28", "30", "36"]],
    ["¿Cuál es el pH del agua pura?", "7", ["0", "5", "14"]],
    ["¿En qué continente está Egipto?", "África", ["Asia", "Europa", "Oceanía"]],
    ["¿Qué significan las letras «WC»?", "Water closet", ["Wash center", "Water cleaner", "Wet corner"]],
    ["¿Qué día es el Día Mundial del Retrete, según la ONU?", "19 de noviembre", ["1 de abril", "22 de marzo", "5 de junio"]],
    ["¿Qué animal hace caca en forma de cubo?", "El uómbat", ["El canguro", "El koala", "El ornitorrinco"]],
    ["¿Quién diseñó un inodoro con cisterna para la reina Isabel I de Inglaterra?", "John Harington", ["Isaac Newton", "William Shakespeare", "Francis Drake"]],
    ["Según la patente original del rollo de papel (1891), el papel va…", "Por encima", ["Por debajo", "De lado", "Al revés"]],
    ["¿Cuánto tiempo, como mínimo, se recomienda frotar las manos con jabón?", "20 segundos", ["3 segundos", "5 minutos", "1 segundo"]],
    ["En las letrinas de la antigua Roma, ¿qué se usaba para limpiarse?", "Una esponja en un palo", ["Hojas de papiro", "Monedas", "Plumas de pavo"]],
    ["¿En qué país hay un famoso Museo Internacional de Retretes?", "India", ["Suiza", "Australia", "Perú"]],
    ["¿De qué está hecho principalmente el papel higiénico?", "Fibras de celulosa", ["Algodón puro", "Plástico", "Seda"]],
    ["¿Qué porcentaje de la superficie de la Tierra cubre el agua, aproximadamente?", "71 %", ["50 %", "35 %", "90 %"]],
    ["¿Cuánto mide aproximadamente el intestino delgado de un adulto?", "Unos 6 metros", ["Unos 50 cm", "Unos 20 metros", "Unos 2 km"]],
    ["¿Qué órgano bombea la sangre por el cuerpo?", "El corazón", ["El hígado", "Los pulmones", "El riñón"]],
    ["¿Cuántos colores tiene tradicionalmente el arcoíris?", "7", ["5", "6", "9"]],
    ["¿Cuál es el río más largo de Sudamérica?", "Amazonas", ["Paraná", "Orinoco", "Magdalena"]],
    ["¿Cuántas teclas tiene un piano estándar?", "88", ["76", "100", "64"]],
    ["¿Qué animal es famoso por dormir colgado boca abajo?", "El murciélago", ["El búho", "El perezoso", "El mapache"]],
    ["¿Qué gas forma la mayor parte del aire que respiramos?", "Nitrógeno", ["Oxígeno", "Dióxido de carbono", "Hidrógeno"]],
    ["¿Cuántos corazones tiene un pulpo?", "3", ["1", "2", "8"]],
  ];
  const WORDS = [
    ["INODORO", "toilet"],
    ["CISTERNA", "toilet"],
    ["BURBUJA", "bubble"],
    ["PAPEL", "roll"],
    ["ESPUMA", "soap"],
    ["TOALLA", "tub"],
    ["ESPEJO", "mirror"],
    ["CEPILLO", "toothbrush"],
    ["BAÑERA", "tub"],
    ["DUCHA", "drop"],
    ["GRIFO", "faucet"],
    ["LAVABO", "faucet"],
    ["PATITO", "duck"],
    ["PEINE", "comb"],
    ["ROLLO", "roll"],
    ["CADENA", "toilet"],
    ["ESPONJA", "sponge"],
    ["AROMA", "soap"],
    ["AZULEJO", "grid"],
    ["JABONERA", "soap"]
  ];
  const ROUNDS = 10, WORD_ROUNDS = [2, 5, 8];

  let plan = [], idx = 0, score = 0, correct = 0, tLeft = 0, tMax = 0, timer = 0, answered = false, lastTick = 0, lastSec = 0;

  function dots() {
    dotsEl.innerHTML = plan.map((p, i) => `<i class="${p.res || (i === idx ? "cur" : "")}"></i>`).join("");
  }

  function start() {
    const qs = B.shuffle(BANK);
    const ws = B.shuffle(WORDS);
    plan = [];
    for (let i = 0, q = 0, w = 0; i < ROUNDS; i++) plan.push(WORD_ROUNDS.includes(i) ? { type: "word", d: ws[w++] } : { type: "q", d: qs[q++] });
    idx = 0; score = 0; correct = 0;
    scoreEl.textContent = 0;
    show();
  }

  function setTimer(secs) {
    tMax = tLeft = secs; lastTick = performance.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const now = performance.now();
      tLeft -= Math.min(1, (now - lastTick) / 1000); lastTick = now;
      paintBar();
      const sec = Math.ceil(tLeft);
      if (sec <= 3 && sec > 0 && sec !== lastSec) B.sfx.tick();
      lastSec = sec;
      if (tLeft <= 0) { clearInterval(timer); timeout(); }
    }, 100);
    paintBar();
  }
  function paintBar() {
    barFill.style.transform = `scaleX(${B.clamp(tLeft / tMax, 0, 1)})`;
    barTxt.textContent = Math.max(0, Math.ceil(tLeft)) + "s";
  }

  function show() {
    answered = false;
    dots();
    const r = plan[idx];
    if (r.type === "q") showQ(r.d); else showWord(r.d);
  }

  function showQ(d) {
    const [q, ok, bad] = d;
    const opts = B.shuffle([ok].concat(bad));
    roundEl.innerHTML = `
      <div class="qcard"><div class="kind"><span>Pregunta</span><span>${String(idx + 1).padStart(2, "0")}/${ROUNDS}</span></div><div class="q-body"><h2>${q}</h2></div></div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-v="${o}"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div>`;
    roundEl.querySelectorAll(".opt").forEach((btn) => btn.addEventListener("click", () => {
      if (answered) return;
      const good = btn.dataset.v === ok;
      if (good) btn.classList.add("ok");
      else { btn.classList.add("ko"); roundEl.querySelector(`.opt[data-v="${CSS.escape(ok)}"]`).classList.add("ok"); }
      finish(good, btn);
    }));
    setTimer(14);
  }

  function showWord(d) {
    const [word, pic] = d;
    const letters = word.split("");
    let mix;
    do { mix = B.shuffle(letters); } while (mix.join("") === word);
    const picked = [];
    roundEl.innerHTML = `
      <div class="qcard"><div class="kind word"><span>Palabra revuelta</span><span>${String(idx + 1).padStart(2, "0")}/${ROUNDS}</span></div>
        <div class="q-body"><h2>Ordena las letras. Pista: está en tu baño.</h2><span class="qpic">${Sprites.svg(pic)}</span></div></div>
      <div class="slots" id="slots">${letters.map(() => '<div class="slot"></div>').join("")}</div>
      <div class="letters" id="letters">${mix.map((l, i) => `<button class="letter" data-i="${i}">${l}</button>`).join("")}</div>
      <div class="word-actions"><button class="btn ghost no-arrow" id="undo">Borrar</button><button class="btn ghost" id="skip">Pasar</button></div>
      <div class="reveal" id="reveal"></div>`;
    const slots = roundEl.querySelectorAll(".slot");
    const btns = roundEl.querySelectorAll(".letter");
    function paint() {
      slots.forEach((s, i) => { s.textContent = picked[i] !== undefined ? mix[picked[i]] : ""; s.classList.toggle("filled", picked[i] !== undefined); });
      btns.forEach((b) => b.classList.toggle("used", picked.includes(+b.dataset.i)));
    }
    function undo() { if (answered || !picked.length) return; picked.pop(); B.sfx.click(); paint(); }
    btns.forEach((b) => b.addEventListener("click", () => {
      if (answered) return;
      picked.push(+b.dataset.i); B.sfx.click(); paint();
      if (picked.length === letters.length) {
        const guess = picked.map((i) => mix[i]).join("");
        const slotsEl = $("slots");
        if (guess === word) { slotsEl.classList.add("ok"); finish(true, slotsEl); }
        else {
          slotsEl.classList.remove("ko"); void slotsEl.offsetWidth; slotsEl.classList.add("ko");
          B.sfx.bad(); B.vibrate(60);
          setTimeout(() => { if (!answered) { picked.length = 0; paint(); } }, 450);
        }
      }
    }));
    $("slots").addEventListener("click", undo);
    $("undo").addEventListener("click", undo);
    $("skip").addEventListener("click", () => { if (!answered) { $("reveal").textContent = "Era: " + word; finish(false, null); } });
    setTimer(25);
  }

  function timeout() {
    if (answered) return;
    const r = plan[idx];
    if (r.type === "q") {
      const ok = r.d[1];
      const el = roundEl.querySelector(`.opt[data-v="${CSS.escape(ok)}"]`);
      if (el) el.classList.add("ok");
    } else {
      const rev = $("reveal"); if (rev) rev.textContent = "¡Se acabó el papel! Era: " + r.d[0];
    }
    FX.toast("Se acabó el papel");
    finish(false, null);
  }

  function finish(good, el) {
    answered = true;
    clearInterval(timer);
    plan[idx].res = good ? "ok" : "ko";
    if (good) {
      correct++;
      const pts = 100 + Math.round(Math.max(0, tLeft) * 5);
      score += pts;
      scoreEl.textContent = score; B.bump(scoreEl);
      B.sfx.good(); B.vibrate(15);
      if (el) {
        const r = el.getBoundingClientRect();
        FX.floatText(r.left + r.width / 2, r.top, "+" + pts, "gold");
        FX.bubbles(r.left + r.width / 2, r.top + r.height / 2, 10);
      }
    } else {
      B.sfx.bad(); B.vibrate(80);
    }
    dots();
    setTimeout(() => {
      idx++;
      if (idx >= ROUNDS) return end();
      show();
    }, good ? 1000 : 1700);
  }

  function end() {
    barTxt.textContent = "";
    B.gameOver({
      id: "trivia", num: "06", name: "TRIVIA DEL TRONO", score, good: correct >= 6,
      format: (v) => v + " pts",
      detail: `${correct}/${ROUNDS} aciertos`,
      titles: [
        { min: 1300, t: "Sabio del Trono" },
        { min: 900, t: "Filósofo de Porcelana" },
        { min: 500, t: "Lector de Botes de Champú" },
        { min: 200, t: "Pensador Distraído" },
        { min: 0, t: "Se Le Durmió el Cerebro" },
      ],
      onRetry: start,
    });
  }

  $("go").addEventListener("click", () => { B.sfx.click(); B.overlay("start", false); start(); });
  barFill.style.transform = "scaleX(1)";
  Sprites.favicon("question");
})();
</script>
</body>
</html>
