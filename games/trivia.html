<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Trivia del Trono</title>
  <meta name="theme-color" content="#f3fbf9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js"></script>
  <script src="../js/fx.js"></script>
  <style>
    .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px 24px; touch-action: pan-y; }
    .inner { max-width: 480px; margin: 0 auto; }
    .dots { display: flex; gap: 6px; justify-content: center; margin: 2px 0 12px; }
    .dots i { width: 22px; height: 8px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 14%, transparent); transition: background .3s, transform .3s; }
    .dots i.cur { background: var(--yellow); transform: scaleY(1.4); }
    .dots i.ok { background: var(--good); }
    .dots i.ko { background: var(--danger); }
    .qcard {
      position: relative;
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in srgb, var(--blue) 12%, transparent) 31px 32px),
        var(--card);
      border: 2px solid var(--card-edge);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 18px 18px 20px;
      min-height: 140px;
      animation: q-in .45s cubic-bezier(.2,1.3,.4,1) both;
    }
    @keyframes q-in { from { transform: translateX(40px) rotate(3deg); opacity: 0; } }
    .qcard .kind {
      display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--yellow) 40%, transparent); color: color-mix(in srgb, var(--yellow-deep) 50%, var(--ink));
    }
    .qcard .kind.word { background: color-mix(in srgb, var(--lilac) 35%, transparent); color: color-mix(in srgb, var(--lilac) 40%, var(--ink)); }
    .qcard h2 { font-size: 1.32rem; line-height: 1.3; margin: 12px 0 0; }
    .qcard .emoji { position: absolute; right: 14px; top: 10px; font-size: 2rem; animation: wobble 2.4s ease-in-out infinite; }
    .opts { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .opt {
      appearance: none; border: 2px solid var(--card-edge); cursor: pointer;
      min-height: 56px; padding: 10px 16px; border-radius: 18px; text-align: left;
      background: var(--card); color: var(--ink); font-weight: 800; font-size: 1.02rem;
      box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 14%, transparent);
      display: flex; gap: 12px; align-items: center;
      transition: transform .12s cubic-bezier(.3,1.6,.5,1), background .2s;
      animation: q-in .45s cubic-bezier(.2,1.3,.4,1) both;
    }
    .opt:nth-child(2) { animation-delay: .05s } .opt:nth-child(3) { animation-delay: .1s } .opt:nth-child(4) { animation-delay: .15s }
    .opt b { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--mint) 25%, transparent); font-family: var(--font-title); }
    .opt:active { transform: scale(.97); }
    .opt.ok { background: color-mix(in srgb, var(--good) 30%, var(--card)); border-color: var(--good); }
    .opt.ko { background: color-mix(in srgb, var(--danger) 25%, var(--card)); border-color: var(--danger); animation: nope .4s; }
    @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* Palabra revuelta */
    .slots, .letters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .slot, .letter {
      width: clamp(28px, calc((min(100vw, 480px) - 32px - 8 * 6px) / 9), 44px);
      aspect-ratio: 0.84; border-radius: 12px; display: grid; place-items: center;
      font-family: var(--font-title); font-weight: 700; font-size: clamp(1.05rem, 5vw, 1.4rem);
    }
    .slot { background: color-mix(in srgb, var(--ink) 7%, transparent); border: 2px dashed color-mix(in srgb, var(--ink) 25%, transparent); cursor: pointer; }
    .slot.filled { background: var(--card); border: 2px solid var(--lilac); animation: bump .25s; }
    .letter {
      appearance: none; border: 0; cursor: pointer; color: #fff;
      background: linear-gradient(180deg, color-mix(in srgb, var(--lilac) 80%, white), var(--lilac));
      box-shadow: 0 4px 0 color-mix(in srgb, var(--lilac) 60%, #23364a);
      transition: transform .12s, opacity .2s;
    }
    .letter:active { transform: translateY(3px); }
    .letter.used { opacity: .2; pointer-events: none; }
    .slots.ok .slot { border-color: var(--good); background: color-mix(in srgb, var(--good) 25%, var(--card)); }
    .slots.ko { animation: nope .4s; }
    .word-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
    .word-actions .btn { min-height: 44px; font-size: .95rem; padding: 0 16px; }
    .reveal { text-align: center; margin-top: 12px; font-weight: 800; color: var(--ink-soft); min-height: 1.4em; }
  </style>
</head>
<body class="game-page">
  <header class="hud">
    <a class="icon-btn" href="../index.html" aria-label="Volver al menú">🚪</a>
    <div class="hud-title">🧠 Trivia del Trono</div>
    <div class="pill" id="score">0</div>
    <button class="icon-btn" id="mute"></button>
  </header>
  <div class="paper-bar"><i id="barFill"></i><b id="barTxt"></b></div>
  <div class="stage">
    <div class="scroll"><div class="inner">
      <div class="dots" id="dots"></div>
      <div id="round"></div>
    </div></div>
  </div>

  <div class="overlay show" id="start">
    <div class="panel">
      <span class="big-emoji">🧠</span>
      <h2>Trivia del Trono</h2>
      <p>Dicen que en el baño se piensa mejor. Vamos a comprobarlo.</p>
      <div class="howto"><ul>
        <li>10 rondas: preguntas y palabras revueltas.</li>
        <li>El papel se desenrolla: ¡responde antes de que se acabe!</li>
        <li>100 puntos por acierto + bonus por rapidez.</li>
      </ul></div>
      <div class="actions"><button class="btn yellow" id="go">¡A pensar!</button></div>
    </div>
  </div>

<script>
(function () {
  const B = Bano, FX = Bano.fx;
  const $ = (id) => document.getElementById(id);
  const roundEl = $("round"), dotsEl = $("dots"), scoreEl = $("score");
  const barFill = $("barFill"), barTxt = $("barTxt");

  // [pregunta, correcta, incorrectas..., emoji]
  const BANK = [
    ["¿Cuántos huesos tiene un ser humano adulto?", "206", ["198", "212", "250"], "🦴"],
    ["¿Qué planeta es conocido como «el planeta rojo»?", "Marte", ["Venus", "Júpiter", "Mercurio"], "🪐"],
    ["¿Cuál es el océano más grande del mundo?", "Pacífico", ["Atlántico", "Índico", "Ártico"], "🌊"],
    ["¿En qué país se inventó el papel?", "China", ["Egipto", "Grecia", "India"], "📜"],
    ["¿Cuál es el animal terrestre más rápido?", "Guepardo", ["León", "Caballo", "Antílope"], "🐆"],
    ["¿Cuántos lados tiene un hexágono?", "6", ["5", "7", "8"], "⬡"],
    ["¿Qué gas absorben las plantas para hacer la fotosíntesis?", "Dióxido de carbono", ["Oxígeno", "Helio", "Nitrógeno"], "🌱"],
    ["¿Cuántos minutos tiene un día?", "1440", ["1240", "1600", "2400"], "⏰"],
    ["¿Qué elemento químico tiene el símbolo «O»?", "Oxígeno", ["Oro", "Osmio", "Ozono"], "🧪"],
    ["¿Qué metal es líquido a temperatura ambiente?", "Mercurio", ["Plomo", "Aluminio", "Estaño"], "🌡️"],
    ["¿Cuántas patas tiene una araña?", "8", ["6", "10", "12"], "🕷️"],
    ["¿Cuál es la capital de Japón?", "Tokio", ["Kioto", "Osaka", "Seúl"], "🗾"],
    ["¿Cuál es el planeta más grande del sistema solar?", "Júpiter", ["Saturno", "Neptuno", "Tierra"], "🪐"],
    ["¿A cuántos grados hierve el agua a nivel del mar?", "100 °C", ["90 °C", "80 °C", "120 °C"], "♨️"],
    ["¿Cuál es el mamífero más grande del planeta?", "Ballena azul", ["Elefante africano", "Cachalote", "Jirafa"], "🐋"],
    ["¿Qué se mide en decibelios?", "El sonido", ["La luz", "La temperatura", "El peso"], "🔊"],
    ["¿Cuál es el hueso más largo del cuerpo humano?", "Fémur", ["Húmero", "Tibia", "Columna"], "🦵"],
    ["¿Cuál es el país más grande del mundo?", "Rusia", ["Canadá", "China", "Brasil"], "🌍"],
    ["¿Qué vitamina produce la piel al recibir sol?", "Vitamina D", ["Vitamina C", "Vitamina A", "Vitamina B12"], "☀️"],
    ["¿Cuántos dientes tiene un adulto contando las muelas del juicio?", "32", ["28", "30", "36"], "🦷"],
    ["¿Cuál es el pH del agua pura?", "7", ["0", "5", "14"], "💧"],
    ["¿En qué continente está Egipto?", "África", ["Asia", "Europa", "Oceanía"], "🐫"],
    ["¿Qué significan las letras «WC»?", "Water closet", ["Wash center", "Water cleaner", "Wet corner"], "🚾"],
    ["¿Qué día es el Día Mundial del Retrete, según la ONU?", "19 de noviembre", ["1 de abril", "22 de marzo", "5 de junio"], "🚽"],
    ["¿Qué animal hace caca en forma de cubo?", "El uómbat", ["El canguro", "El koala", "El ornitorrinco"], "🧊"],
    ["¿Quién diseñó un inodoro con cisterna para la reina Isabel I de Inglaterra?", "John Harington", ["Isaac Newton", "William Shakespeare", "Francis Drake"], "👑"],
    ["Según la patente original del rollo de papel (1891), el papel va…", "Por encima", ["Por debajo", "De lado", "Al revés"], "🧻"],
    ["¿Cuánto tiempo, como mínimo, se recomienda frotar las manos con jabón?", "20 segundos", ["3 segundos", "5 minutos", "1 segundo"], "🧼"],
    ["En las letrinas de la antigua Roma, ¿qué se usaba para limpiarse?", "Una esponja en un palo", ["Hojas de papiro", "Monedas", "Plumas de pavo"], "🏛️"],
    ["¿En qué país hay un famoso Museo Internacional de Retretes?", "India", ["Suiza", "Australia", "Perú"], "🏺"],
    ["¿De qué está hecho principalmente el papel higiénico?", "Fibras de celulosa", ["Algodón puro", "Plástico", "Seda"], "🌳"],
    ["¿Qué porcentaje de la superficie de la Tierra cubre el agua, aproximadamente?", "71 %", ["50 %", "35 %", "90 %"], "🌎"],
    ["¿Cuánto mide aproximadamente el intestino delgado de un adulto?", "Unos 6 metros", ["Unos 50 cm", "Unos 20 metros", "Unos 2 km"], "🌀"],
    ["¿Qué órgano bombea la sangre por el cuerpo?", "El corazón", ["El hígado", "Los pulmones", "El riñón"], "❤️"],
    ["¿Cuántos colores tiene tradicionalmente el arcoíris?", "7", ["5", "6", "9"], "🌈"],
    ["¿Cuál es el río más largo de Sudamérica?", "Amazonas", ["Paraná", "Orinoco", "Magdalena"], "🏞️"],
    ["¿Cuántas teclas tiene un piano estándar?", "88", ["76", "100", "64"], "🎹"],
    ["¿Qué animal es famoso por dormir colgado boca abajo?", "El murciélago", ["El búho", "El perezoso", "El mapache"], "🦇"],
    ["¿Qué gas forma la mayor parte del aire que respiramos?", "Nitrógeno", ["Oxígeno", "Dióxido de carbono", "Hidrógeno"], "🌬️"],
    ["¿Cuántos corazones tiene un pulpo?", "3", ["1", "2", "8"], "🐙"],
  ];
  const WORDS = [
    ["INODORO", "🚽"], ["CISTERNA", "🪣"], ["BURBUJA", "🫧"], ["PAPEL", "🧻"], ["ESPUMA", "🧼"],
    ["TOALLA", "🏳️"], ["ESPEJO", "🪞"], ["CEPILLO", "🪥"], ["BAÑERA", "🛁"], ["DUCHA", "🚿"],
    ["GRIFO", "🚰"], ["LAVABO", "🫗"], ["PATITO", "🦆"], ["PEINE", "🪮"], ["ROLLO", "🧻"],
    ["CADENA", "⛓️"], ["ESPONJA", "🧽"], ["AROMA", "🌸"], ["AZULEJO", "🟦"], ["JABONERA", "🧼"],
  ];
  const ROUNDS = 10, WORD_ROUNDS = [2, 5, 8];

  let plan = [], idx = 0, score = 0, correct = 0, tLeft = 0, tMax = 0, timer = 0, answered = false, lastTick = 0, lastSec = 0;

  function dots() {
    dotsEl.innerHTML = plan.map((p, i) => `<i class="${p.res || (i === idx ? "cur" : "")}"></i>`).join("");
  }

  function start() {
    const qs = B.shuffle(BANK);
    const ws = B.shuffle(WORDS);
    plan = [];
    for (let i = 0, q = 0, w = 0; i < ROUNDS; i++) plan.push(WORD_ROUNDS.includes(i) ? { type: "word", d: ws[w++] } : { type: "q", d: qs[q++] });
    idx = 0; score = 0; correct = 0;
    scoreEl.textContent = 0;
    show();
  }

  function setTimer(secs) {
    tMax = tLeft = secs; lastTick = performance.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const now = performance.now();
      tLeft -= Math.min(1, (now - lastTick) / 1000); lastTick = now;
      paintBar();
      const sec = Math.ceil(tLeft);
      if (sec <= 3 && sec > 0 && sec !== lastSec) B.sfx.tick();
      lastSec = sec;
      if (tLeft <= 0) { clearInterval(timer); timeout(); }
    }, 100);
    paintBar();
  }
  function paintBar() {
    barFill.style.transform = `scaleX(${B.clamp(tLeft / tMax, 0, 1)})`;
    barTxt.textContent = Math.max(0, Math.ceil(tLeft)) + "s";
  }

  function show() {
    answered = false;
    dots();
    const r = plan[idx];
    if (r.type === "q") showQ(r.d); else showWord(r.d);
  }

  function showQ(d) {
    const [q, ok, bad, emoji] = d;
    const opts = B.shuffle([ok].concat(bad));
    roundEl.innerHTML = `
      <div class="qcard"><span class="kind">Pregunta ${idx + 1}/${ROUNDS}</span><span class="emoji">${emoji}</span><h2>${q}</h2></div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-v="${o}"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div>`;
    roundEl.querySelectorAll(".opt").forEach((btn) => btn.addEventListener("click", () => {
      if (answered) return;
      const good = btn.dataset.v === ok;
      if (good) btn.classList.add("ok");
      else { btn.classList.add("ko"); roundEl.querySelector(`.opt[data-v="${CSS.escape(ok)}"]`).classList.add("ok"); }
      finish(good, btn);
    }));
    setTimer(14);
  }

  function showWord(d) {
    const [word, emoji] = d;
    const letters = word.split("");
    let mix;
    do { mix = B.shuffle(letters); } while (mix.join("") === word);
    const picked = [];
    roundEl.innerHTML = `
      <div class="qcard"><span class="kind word">Palabra revuelta ${idx + 1}/${ROUNDS}</span><span class="emoji">${emoji}</span>
        <h2>Ordena las letras. Pista: está en tu baño.</h2></div>
      <div class="slots" id="slots">${letters.map(() => '<div class="slot"></div>').join("")}</div>
      <div class="letters" id="letters">${mix.map((l, i) => `<button class="letter" data-i="${i}">${l}</button>`).join("")}</div>
      <div class="word-actions"><button class="btn ghost" id="undo">↩︎ Borrar</button><button class="btn ghost" id="skip">⏭ Pasar</button></div>
      <div class="reveal" id="reveal"></div>`;
    const slots = roundEl.querySelectorAll(".slot");
    const btns = roundEl.querySelectorAll(".letter");
    function paint() {
      slots.forEach((s, i) => { s.textContent = picked[i] !== undefined ? mix[picked[i]] : ""; s.classList.toggle("filled", picked[i] !== undefined); });
      btns.forEach((b) => b.classList.toggle("used", picked.includes(+b.dataset.i)));
    }
    function undo() { if (answered || !picked.length) return; picked.pop(); B.sfx.click(); paint(); }
    btns.forEach((b) => b.addEventListener("click", () => {
      if (answered) return;
      picked.push(+b.dataset.i); B.sfx.click(); paint();
      if (picked.length === letters.length) {
        const guess = picked.map((i) => mix[i]).join("");
        const slotsEl = $("slots");
        if (guess === word) { slotsEl.classList.add("ok"); finish(true, slotsEl); }
        else {
          slotsEl.classList.remove("ko"); void slotsEl.offsetWidth; slotsEl.classList.add("ko");
          B.sfx.bad(); B.vibrate(60);
          setTimeout(() => { if (!answered) { picked.length = 0; paint(); } }, 450);
        }
      }
    }));
    $("slots").addEventListener("click", undo);
    $("undo").addEventListener("click", undo);
    $("skip").addEventListener("click", () => { if (!answered) { $("reveal").textContent = "Era: " + word; finish(false, null); } });
    setTimer(25);
  }

  function timeout() {
    if (answered) return;
    const r = plan[idx];
    if (r.type === "q") {
      const ok = r.d[1];
      const el = roundEl.querySelector(`.opt[data-v="${CSS.escape(ok)}"]`);
      if (el) el.classList.add("ok");
    } else {
      const rev = $("reveal"); if (rev) rev.textContent = "¡Se acabó el papel! Era: " + r.d[0];
    }
    FX.toast("⏰ ¡Se acabó el papel!");
    finish(false, null);
  }

  function finish(good, el) {
    answered = true;
    clearInterval(timer);
    plan[idx].res = good ? "ok" : "ko";
    if (good) {
      correct++;
      const pts = 100 + Math.round(Math.max(0, tLeft) * 5);
      score += pts;
      scoreEl.textContent = score; B.bump(scoreEl);
      B.sfx.good(); B.vibrate(15);
      if (el) {
        const r = el.getBoundingClientRect();
        FX.floatText(r.left + r.width / 2, r.top, "+" + pts, "gold");
        FX.bubbles(r.left + r.width / 2, r.top + r.height / 2, 10);
      }
    } else {
      B.sfx.bad(); B.vibrate(80);
    }
    dots();
    setTimeout(() => {
      idx++;
      if (idx >= ROUNDS) return end();
      show();
    }, good ? 1000 : 1700);
  }

  function end() {
    barTxt.textContent = "";
    B.gameOver({
      id: "trivia", score, good: correct >= 6,
      format: (v) => v + " pts",
      detail: `${correct}/${ROUNDS} aciertos`,
      titles: [
        { min: 1300, t: "Sabio del Trono" },
        { min: 900, t: "Filósofo de Porcelana" },
        { min: 500, t: "Lector de Botes de Champú" },
        { min: 200, t: "Pensador Distraído" },
        { min: 0, t: "Se Le Durmió el Cerebro" },
      ],
      onRetry: start,
    });
  }

  $("go").addEventListener("click", () => { B.sfx.click(); B.overlay("start", false); start(); });
  barFill.style.transform = "scaleX(1)";
})();
</script>
</body>
</html>
