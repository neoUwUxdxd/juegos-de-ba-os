<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Memorama del Botiquín</title>
  <meta name="theme-color" content="#1D3B4F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js"></script>
  <script src="../js/fx.js"></script>
  <script src="../js/sprites.js"></script>
  <style>
    .board-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 22px 16px 18px; }
    .cabinet {
      width: min(100%, 440px, calc((100dvh - 160px) * 0.74));
      padding: 12px;
      border-radius: 4px;
      background: var(--white);
      border: 2px solid var(--line);
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .cabinet::before {
      content: ""; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 36px; border-radius: 4px;
      background:
        linear-gradient(#fff, #fff) center / 20px 6px no-repeat,
        linear-gradient(#fff, #fff) center / 6px 20px no-repeat,
        var(--red);
      border: 2px solid var(--line);
    }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .card { aspect-ratio: 3 / 4; perspective: 700px; cursor: pointer; border: 0; padding: 0; background: none; }
    .card .inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .card.open .inner, .card.done .inner { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; border-radius: 3px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; border: 2px solid var(--line); }
    .front {
      /* Puertita con espejo */
      background:
        linear-gradient(125deg, transparent 0 34%, #fff 34% 40%, transparent 40% 52%, #fff 52% 55%, transparent 55%),
        #BFE0FF;
    }
    .front::after { /* manija */
      content: ""; position: absolute; right: 5px; top: 50%; width: 6px; height: 22%; margin-top: -11%;
      border-radius: 2px; background: #A9B3BB; border: 2px solid #1D3B4F;
    }
    .back { transform: rotateY(180deg); background: var(--c, #fff); padding: 14%; }
    .card.done .back { border-color: var(--green); box-shadow: inset 0 0 0 3px var(--green); }
    .card.nope .inner { animation: nope .3s steps(4); }
    @keyframes nope { 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
  </style>
</head>
<body class="game-page">
  <header class="hud">
    <a class="icon-btn" href="../index.html" aria-label="Volver al menú"><i data-sprite="door"></i></a>
    <div class="hud-title"><span class="hud-num">04</span>Memorama</div>
    <div class="pill" id="time">0:00</div>
    <div class="pill" id="moves">0 mov.</div>
    <button class="icon-btn" id="mute"></button>
  </header>
  <div class="stage" id="stage">
    <div class="board-wrap"><div class="cabinet"><div class="board" id="board"></div></div></div>
  </div>

  <div class="overlay show" id="start">
    <div class="panel">
      <div class="panel-head"><span>Instrucciones</span><span>Cubículo 04</span></div>
      <div class="panel-body">
        <div class="hero"><span class="big-pic"><i data-sprite="mirror"></i></span><div><h2>Memorama del botiquín</h2><p>Cada puertita del botiquín esconde algo. ¿Recuerdas dónde quedó cada cosa?</p></div></div>
        <ol class="howto">
          <li><b>1</b><span>Toca dos puertitas para abrirlas.</span></li>
          <li><b>2</b><span>Si son iguales, se quedan abiertas.</span></li>
          <li><b>3</b><span>Encuentra las 8 parejas con los menos movimientos posibles.</span></li>
        </ol>
        <div class="actions"><button class="btn green" id="go">Abrir el botiquín</button></div>
      </div>
    </div>
  </div>

<script>
(function () {
  const B = Bano, FX = Bano.fx;
  const board = document.getElementById("board");
  const movesEl = document.getElementById("moves"), timeEl = document.getElementById("time");
  const items = ["toothbrush", "soap", "sponge", "bottle", "razor", "tub", "duck", "roll", "bandage", "pill", "comb", "teddy"];
  const names = { toothbrush: "Cepillo", soap: "Jabón", sponge: "Esponja", bottle: "Champú", razor: "Rastrillo", tub: "Tina", duck: "Patito", roll: "Papel", bandage: "Curita", pill: "Pastilla", comb: "Peine", teddy: "Osito" };
  const colors = ["#F0BF45", "#FFFFFF", "#F4F1E8", "#FFE680", "#FFFFFF", "#F4F1E8", "#F0BF45", "#FFFFFF"];

  let first = null, lock = false, moves = 0, found = 0, t0 = 0, timer = 0, playing = false;

  function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function build() {
    const chosen = B.shuffle(items).slice(0, 8);
    const deck = B.shuffle(chosen.concat(chosen));
    board.innerHTML = "";
    deck.forEach((e) => {
      const ci = chosen.indexOf(e);
      const card = document.createElement("button");
      card.className = "card";
      card.dataset.e = e;
      card.setAttribute("aria-label", "Puertita cerrada");
      card.innerHTML = `<div class="inner"><div class="face front"></div><div class="face back" style="--c:${colors[ci]}">${Sprites.svg(e)}</div></div>`;
      card.addEventListener("click", () => flip(card));
      board.appendChild(card);
    });
  }

  function start() {
    first = null; lock = false; moves = 0; found = 0;
    movesEl.textContent = "0 mov."; timeEl.textContent = "0:00";
    build();
    t0 = Date.now(); playing = true;
    clearInterval(timer);
    timer = setInterval(() => { timeEl.textContent = fmtTime(Math.floor((Date.now() - t0) / 1000)); }, 500);
  }

  function flip(card) {
    if (!playing || lock || card === first || card.classList.contains("done")) return;
    card.classList.add("open");
    card.setAttribute("aria-label", names[card.dataset.e]);
    B.sfx.click();
    if (!first) { first = card; return; }
    moves++;
    movesEl.textContent = moves + " mov.";
    B.bump(movesEl);
    const a = first, b = card;
    first = null;
    if (a.dataset.e === b.dataset.e) {
      setTimeout(() => {
        a.classList.add("done"); b.classList.add("done");
        B.sfx.good(); B.vibrate(15);
        const r = b.getBoundingClientRect();
        FX.bubbles(r.left + r.width / 2, r.top + r.height / 2, 10);
        found++;
        if (found === 8) win();
      }, 250);
    } else {
      lock = true;
      setTimeout(() => { a.classList.add("nope"); b.classList.add("nope"); B.sfx.bad(); }, 450);
      setTimeout(() => {
        a.classList.remove("open", "nope"); b.classList.remove("open", "nope");
        a.setAttribute("aria-label", "Puertita cerrada"); b.setAttribute("aria-label", "Puertita cerrada");
        lock = false;
      }, 900);
    }
  }

  function win() {
    playing = false; clearInterval(timer);
    const secs = Math.floor((Date.now() - t0) / 1000);
    setTimeout(() => {
      B.gameOver({
        id: "memorama", num: "04", name: "MEMORAMA DEL BOTIQUÍN", score: moves, lowerIsBetter: true, good: true,
        format: (v) => v + " mov.",
        detail: "Tiempo: " + fmtTime(secs),
        titles: [
          { min: 10, t: "Memoria de Elefante en Bata" },
          { min: 13, t: "Mente Brillante como Azulejo" },
          { min: 17, t: "Buen Ojo de Espejo" },
          { min: 24, t: "Revisor de Botiquines" },
          { min: 999, t: "¿Dónde Dejé el Cepillo?" },
        ],
        onRetry: start,
      });
    }, 500);
  }

  document.getElementById("go").addEventListener("click", () => { B.sfx.swish(); B.overlay("start", false); start(); });
  build();
  Sprites.favicon("mirror");
})();
</script>
</body>
</html>
