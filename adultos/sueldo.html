<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sueldo del Trono</title>
  <meta name="theme-color" content="#f3fbf9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js"></script>
  <script src="../js/fx.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/perfil.js"></script>
  <script src="../js/jefe.js"></script>
  <script src="../js/sprites.js"></script>
  <style>
    .hud { border-bottom-color: var(--blue); }
    .hud-num { background: var(--pink-deep); color: #fff; }
    .area { flex: 1; overflow-y: auto; padding: 6px 16px 90px; max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .box { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; }
    .money { text-align: center; }
    .money .amt { font-family: var(--font-title); font-weight: 700; font-size: clamp(2.6rem, 14vw, 3.6rem); line-height: 1.05; color: var(--good); font-variant-numeric: tabular-nums; }
    .money .clk { font-weight: 800; color: var(--ink-soft); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .money .quip { margin-top: 8px; font-weight: 700; min-height: 1.4em; }
    .big { width: 100%; min-height: 72px; font-size: 1.35rem; }
    .cfg { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .cfg input, .cfg select { min-height: 48px; border-radius: 12px; border: 2px solid rgba(35,54,74,.15); padding: 0 10px; font: inherit; font-weight: 700; width: 100%; background: #fff; color: #23364a; }
    .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .totals div { background: color-mix(in srgb, var(--mint) 16%, #fff); border-radius: 16px; padding: 10px; text-align: center; }
    .totals b { display: block; font-family: var(--font-title); font-size: 1.3rem; }
    .totals small { font-weight: 800; color: var(--ink-soft); font-size: .75rem; }
    .hist { list-style: none; margin: 0; padding: 0; }
    .hist li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(35,54,74,.08); font-weight: 700; font-size: .92rem; }
    .hist li span:last-child { color: var(--good); }
    .lbl { font-weight: 800; margin: 0 0 8px; }
  </style>
</head>
<body class="game-page">
  <header class="hud">
    <a class="icon-btn" href="index.html" aria-label="Volver a la Zona Adultos"><i data-sprite="door"></i></a>
    <div class="hud-title"><span class="hud-num">💸</span>Sueldo del trono</div>
    
    <button class="icon-btn" id="mute"></button>
  </header>
  <div class="area">
    <div class="box money">
      <div class="amt" id="amt">$0.00</div>
      <div class="clk" id="clk">00:00</div>
      <div class="quip" id="quip">¿Listo para que te paguen por estar aquí?</div>
    </div>
    <button class="btn big" id="toggle">🚽 Empecé</button>
    <div class="box">
      <p class="lbl">¿Cuánto ganas?</p>
      <div class="cfg">
        <input type="number" id="rate" min="0" step="0.01" inputmode="decimal" placeholder="0">
        <select id="per"><option value="h">por hora</option><option value="d">por día (8 h)</option><option value="m">por mes (176 h)</option></select>
        <select id="cur"><option>$</option><option>€</option><option>US$</option><option>S/</option><option>Bs</option></select>
      </div>
      <p class="muted" style="margin:8px 0 0;font-size:.82rem;color:var(--ink-soft)">Se guarda solo en este celular.</p>
    </div>
    <div class="totals"><div><b id="tMonth">$0</b><small>este mes</small></div><div><b id="tTime">0 min</b><small>en el trono este mes</small></div><div><b id="tAll">$0</b><small>en total</small></div><div><b id="tCount">0</b><small>visitas pagadas</small></div></div>
    <div class="box"><p class="lbl">Historial</p><ul class="hist" id="hist"></ul></div>
  </div>
<script>
(function () {
  const B = Bano, FX = Bano.fx;
  const $ = (id) => document.getElementById(id);

  const QUIPS = ["Tu jefe acaba de pagarte por pensar en la vida.", "Esto sí es productividad.", "Cada segundo cuenta… literalmente.", "Ni la bolsa de valores sube así.", "Ahorro para el retiro: activado.", "Junta importante en curso."];
  let cfg = B.store.get("sueldo:cfg", { rate: "", per: "h", cur: "$" });
  let hist = B.store.get("sueldo:hist", []);
  let running = B.store.get("sueldo:start", null);
  const perHour = () => { const r = parseFloat(cfg.rate) || 0; return cfg.per === "d" ? r / 8 : cfg.per === "m" ? r / 176 : r; };
  const money = (v) => cfg.cur + " " + v.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  $("rate").value = cfg.rate; $("per").value = cfg.per; $("cur").value = cfg.cur;
  ["rate", "per", "cur"].forEach((id) => $(id).addEventListener("input", () => { cfg = { rate: $("rate").value, per: $("per").value, cur: $("cur").value }; B.store.set("sueldo:cfg", cfg); paintAll(); }));
  function paintTotals() {
    const now = new Date(), mk = now.getFullYear() + "-" + now.getMonth();
    const month = hist.filter((h) => { const d = new Date(h.t); return d.getFullYear() + "-" + d.getMonth() === mk; });
    $("tMonth").textContent = money(month.reduce((a, h) => a + h.m, 0));
    $("tTime").textContent = Math.round(month.reduce((a, h) => a + h.s, 0) / 60) + " min";
    $("tAll").textContent = money(hist.reduce((a, h) => a + h.m, 0));
    $("tCount").textContent = hist.length;
    $("hist").innerHTML = hist.length ? hist.slice(-15).reverse().map((h) => `<li><span>${new Date(h.t).toLocaleDateString("es", { day: "numeric", month: "short" })} · ${mmss(h.s)}</span><span>+${money(h.m)}</span></li>`).join("") : '<li><span class="muted">Todavía no hay visitas pagadas.</span><span></span></li>';
  }
  function tick() {
    const s = running ? (Date.now() - running) / 1000 : 0;
    $("amt").textContent = money(perHour() * s / 3600);
    $("clk").textContent = mmss(s);
  }
  function paintAll() {
    $("toggle").textContent = running ? "✅ Terminé" : "🚽 Empecé";
    $("toggle").className = "btn big" + (running ? " green" : "");
    tick(); paintTotals();
  }
  $("toggle").addEventListener("click", () => {
    if (!perHour()) { FX.toast("Primero pon cuánto ganas 👇"); $("rate").focus(); return; }
    if (!running) {
      running = Date.now(); B.store.set("sueldo:start", running);
      $("quip").textContent = B.pick(QUIPS); B.sfx.click();
    } else {
      const s = (Date.now() - running) / 1000, m = perHour() * s / 3600;
      hist.push({ t: running, s: Math.round(s), m: Math.round(m * 100) / 100 });
      B.store.set("sueldo:hist", hist.slice(-200));
      running = null; B.store.set("sueldo:start", null);
      $("quip").textContent = "Te pagaron " + money(m) + " por esta visita. 🎉";
      B.sfx.flush(); B.fx.confetti(1800);
      if (window.Logros) { Logros.count("sueldo"); Logros.check(); }
    }
    paintAll();
  });
  setInterval(tick, 100);
  paintAll();
  Sprites.favicon("money");
})();
</script>
</body>
</html>
